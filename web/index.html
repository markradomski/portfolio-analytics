<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Analytics</title>
    <!-- Vanyard's editorial serif (sec 7 of the theme spec) only -- Light/
         Dark's --font-body stays untouched, so this has no effect on them:
         Source Serif 4 isn't named anywhere in their font stacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the resolved colour theme before first paint so the page
      // never flashes the wrong theme. Mirrors applyTheme() in
      // src/hooks/useTheme.ts: an explicit, validly-stored "light"/"dark"/
      // "vanyard" wins; anything else (first visit, cleared storage, an
      // invalid stored value, or localStorage throwing entirely) falls
      // through to Vanyard Dark, the app's canonical default presentation.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark" || t === "vanyard") {
            document.documentElement.setAttribute("data-theme", t);
            return;
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", "vanyard");
        document.documentElement.setAttribute("data-vanyard-mode", "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
